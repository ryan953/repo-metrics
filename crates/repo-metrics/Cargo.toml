[package]
name = "repo-metrics"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repo-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
git2 = "0.19"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
