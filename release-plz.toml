# release-plz configuration.
# https://release-plz.dev/docs/config

[workspace]
# This crate is distributed as a GitHub Release binary, not on crates.io, so
# skip `cargo publish`. release-plz still bumps the version, updates the
# changelog, tags, and creates the GitHub Release.
publish = false

# Create the git tag and GitHub Release (both default true; set explicitly so
# the intent is obvious).
git_tag_enable = true
git_release_enable = true

# Create the GitHub Release as a draft. GitHub's immutable-releases feature
# makes a *published* release read-only, which blocks release.yml from attaching
# the built binaries (HTTP 422). Drafts stay mutable, so release.yml uploads the
# tarballs to the draft and then publishes it once all assets are attached.
git_release_draft = true
