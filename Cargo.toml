[package]
name = "repo-metrics"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repo-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
git2 = "0.19"
once_cell = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
